name: Build Kubernetes Components Images for RISC-V and x86

on:
  workflow_dispatch:
    inputs:
      k8s_version:
        description: 'Kubernetes version (e.g., v1.35.0)'
        required: false
        default: 'latest'
  schedule:
    - cron: "0 02 23 * *"

jobs:
  get-versions:
    runs-on: ubuntu-latest
    outputs:
      k8s_version: ${{ steps.versions.outputs.k8s_version }}
      k8s_tag: ${{ steps.versions.outputs.k8s_tag }}
    steps:
      - name: Get latest versions
        id: versions
        run: |
          if [ "${{ github.event.inputs.k8s_version }}" = "latest" ] || [ -z "${{ github.event.inputs.k8s_version }}" ]; then
            K8S_VERSION=$(curl -s https://api.github.com/repos/kubernetes/kubernetes/tags | \
              jq -r '.[].name' | \
              grep -v -E 'alpha|beta|rc' | \
              grep '^v1\.' | \
              sort -V | \
              tail -n 1)
          else
            K8S_VERSION="${{ github.event.inputs.k8s_version }}"
          fi

          K8S_TAG="${K8S_VERSION#v}"

          echo "k8s_version=$K8S_VERSION" >> "$GITHUB_OUTPUT"
          echo "k8s_tag=$K8S_TAG" >> "$GITHUB_OUTPUT"

          echo "Building Kubernetes components: $K8S_VERSION"

  build-components-x86:
    needs: get-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [kube-apiserver, kube-controller-manager, kube-scheduler, kube-proxy]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Clone Kubernetes repository
        run: |
          rm -rf kubernetes
          git clone --depth=1 \
            --branch "${{ needs.get-versions.outputs.k8s_version }}" \
            https://github.com/kubernetes/kubernetes.git

      - name: Build ${{ matrix.component }} for x86_64
        run: |
          cd kubernetes
          make WHAT=cmd/${{ matrix.component }}

          mkdir -p /tmp/${{ matrix.component }}-build

          if [ "${{ matrix.component }}" = "kube-proxy" ]; then
            cat > /tmp/${{ matrix.component }}-build/Dockerfile << 'EOF'
          FROM debian:trixie-slim
          RUN apt-get update && \
              apt-get install -y \
                ca-certificates iptables iproute2 conntrack ipset && \
              rm -rf /var/lib/apt/lists/*
          COPY ${{ matrix.component }} /usr/local/bin/${{ matrix.component }}
          RUN chmod +x /usr/local/bin/${{ matrix.component }}
          ENTRYPOINT ["/usr/local/bin/${{ matrix.component }}"]
          EOF
          else
            cat > /tmp/${{ matrix.component }}-build/Dockerfile << 'EOF'
          FROM debian:trixie-slim
          RUN apt-get update && \
              apt-get install -y ca-certificates && \
              rm -rf /var/lib/apt/lists/*
          COPY ${{ matrix.component }} /usr/local/bin/${{ matrix.component }}
          RUN chmod +x /usr/local/bin/${{ matrix.component }}
          ENTRYPOINT ["/usr/local/bin/${{ matrix.component }}"]
          EOF
          fi

          cp "_output/bin/${{ matrix.component }}" /tmp/${{ matrix.component }}-build/

          cd /tmp/${{ matrix.component }}-build
          docker build \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ needs.get-versions.outputs.k8s_tag }}-amd64" \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:latest-amd64" \
            .

          docker push "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ needs.get-versions.outputs.k8s_tag }}-amd64"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:latest-amd64"

  build-components-riscv:
    needs: get-versions
    # RISE CI enablement project — stays on RISE's Scaleway EM-RV1 fleet
    # rather than the default self-hosted RISCV64 runners.
    runs-on: ubuntu-24.04-riscv
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [kube-apiserver, kube-controller-manager, kube-scheduler, kube-proxy]
    steps:
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Setup Go
        run: |
          set -eu
          # Ubuntu's riscv64 `golang` (1.22) hits runtime scheduler crashes on
          # riscv64; take a current toolchain from go.dev, with a pinned
          # fallback if the download index is unreachable.
          GO_VER=$(curl -fsSL --retry 3 'https://go.dev/dl/?mode=json' 2>/dev/null \
            | grep -o '"version"[[:space:]]*:[[:space:]]*"go[0-9.]*"' | head -n1 \
            | grep -o 'go[0-9.]*' || true)
          [ -n "$GO_VER" ] || GO_VER="go1.24.6"
          curl -fsSL --retry 3 --retry-delay 10 -o /tmp/go.tar.gz \
            "https://go.dev/dl/${GO_VER}.linux-riscv64.tar.gz"
          sudo apt-get remove -y golang golang-go 2>/dev/null || true
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          /usr/local/go/bin/go version

      - name: Clean workspace with elevated permissions
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"

      - name: Clone Kubernetes repository
        run: |
          git clone --depth=1 \
            --branch "${{ needs.get-versions.outputs.k8s_version }}" \
            https://github.com/kubernetes/kubernetes.git \
            "$GITHUB_WORKSPACE/kubernetes"

      - name: Build ${{ matrix.component }} for RISC-V
        run: |
          cd "$GITHUB_WORKSPACE/kubernetes"
          KUBE_BUILD_PLATFORMS=linux/riscv64 make WHAT=cmd/${{ matrix.component }}

          mkdir -p /tmp/${{ matrix.component }}-build

          if [ "${{ matrix.component }}" = "kube-proxy" ]; then
            cat > /tmp/${{ matrix.component }}-build/Dockerfile << 'EOF'
          FROM riscv64/debian:trixie-slim
          RUN apt-get update && \
              apt-get install -y \
                ca-certificates iptables iproute2 conntrack ipset && \
              rm -rf /var/lib/apt/lists/*
          COPY ${{ matrix.component }} /usr/local/bin/${{ matrix.component }}
          RUN chmod +x /usr/local/bin/${{ matrix.component }}
          ENTRYPOINT ["/usr/local/bin/${{ matrix.component }}"]
          EOF
          else
            cat > /tmp/${{ matrix.component }}-build/Dockerfile << 'EOF'
          FROM riscv64/debian:trixie-slim
          RUN apt-get update && \
              apt-get install -y ca-certificates && \
              rm -rf /var/lib/apt/lists/*
          COPY ${{ matrix.component }} /usr/local/bin/${{ matrix.component }}
          RUN chmod +x /usr/local/bin/${{ matrix.component }}
          ENTRYPOINT ["/usr/local/bin/${{ matrix.component }}"]
          EOF
          fi

          cp "$GITHUB_WORKSPACE/kubernetes/_output/local/go/bin/${{ matrix.component }}" \
            /tmp/${{ matrix.component }}-build/

          cd /tmp/${{ matrix.component }}-build
          docker build \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ needs.get-versions.outputs.k8s_tag }}-riscv64" \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:latest-riscv64" \
            .

          docker push "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ needs.get-versions.outputs.k8s_tag }}-riscv64"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:latest-riscv64"

  create-manifests:
    needs: [get-versions, build-components-x86, build-components-riscv]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [kube-apiserver, kube-controller-manager, kube-scheduler, kube-proxy]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create ${{ matrix.component }} multi-arch manifest
        run: |
          docker manifest rm \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ needs.get-versions.outputs.k8s_tag }}" \
            2>/dev/null || true
          docker manifest rm \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:latest" \
            2>/dev/null || true

          docker manifest create \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ needs.get-versions.outputs.k8s_tag }}" \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ needs.get-versions.outputs.k8s_tag }}-amd64" \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ needs.get-versions.outputs.k8s_tag }}-riscv64"

          docker manifest push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ needs.get-versions.outputs.k8s_tag }}"

          docker manifest create \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:latest" \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:latest-amd64" \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:latest-riscv64"

          docker manifest push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:latest"
