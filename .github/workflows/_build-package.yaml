# Reusable "base" workflow for all RISC-V package builds.
#
# This file owns everything that every build-* workflow had in common:
#   - the self-hosted runner (runs-on)
#   - permissions
#   - apt dependency installation (with retries)
#   - optional modern Go toolchain from go.dev
#   - workspace cleanup
#   - repo checkout
#   - artifact upload
#   - the optional GitHub Pages refresh dispatch
#
# Each build-<package>.yml is now a thin "overlay": it only declares the
# triggers (cron schedule) and passes the package-specific bits in via
# `with:`. Think of this as the kustomize base; the build-*.yml files are
# the overlays.
#
# Contract for `build-script`:
#   The script runs as a single bash step. It is responsible for fetching,
#   building, verifying and staging the package. When done it MUST export
#   the final artifact location by appending two lines to $GITHUB_ENV:
#       echo "ASSET_NAME=<file name>"  >> "$GITHUB_ENV"
#       echo "ASSET_PATH=<abs path>"   >> "$GITHUB_ENV"
#   Those are picked up by the Upload artifact step below, which refuses to
#   run if the file is missing or empty (see "Verify build output").

name: Reusable RISC-V package build

on:
  workflow_call:
    inputs:
      package-name:
        description: Human-readable package name (used only for the job label).
        required: true
        type: string
      runner:
        description: >-
          Runner label to execute on. Defaults to the self-hosted RISCV64 fleet.
          Workflows belonging to the RISE CI enablement project pass
          ubuntu-24.04-riscv instead, to stay on RISE's Scaleway EM-RV1 machines.
        required: false
        type: string
        default: RISCV64
      timeout-minutes:
        description: >-
          Hard cap for the build job. GitHub kills jobs at 360 minutes;
          staying under it lets us fail with readable logs instead of an
          opaque "exceeded maximum execution time".
        required: false
        type: number
        default: 350
      apt-packages:
        description: >-
          apt packages to install before building. Space- or newline-
          separated. Leave empty to skip apt installation entirely.
        required: false
        type: string
        default: ""
      go-version:
        description: >-
          Install a Go toolchain from go.dev instead of relying on apt's.
          Use "latest" to track upstream stable, or pin e.g. "go1.24.6".
          Ubuntu's riscv64 `golang` package is old enough to hit runtime
          scheduler crashes on riscv64, so any Go build should set this.
        required: false
        type: string
        default: ""
      clean-workspace:
        description: Wipe $GITHUB_WORKSPACE with elevated permissions before checkout.
        required: false
        type: boolean
        default: true
      checkout:
        description: Check out this repository before building.
        required: false
        type: boolean
        default: true
      setup-script:
        description: >-
          Optional shell run after checkout but before the main build
          (extra toolchains, language runtimes, virtualenvs, etc.).
        required: false
        type: string
        default: ""
      build-script:
        description: >-
          Main shell script: fetch, build, verify and stage the package.
          Must export ASSET_NAME and ASSET_PATH to $GITHUB_ENV when done.
        required: true
        type: string
      publish-release:
        description: >-
          Attach the built asset to a release tagged release-YYYY-MM-DD,
          creating that release if it does not exist yet. Without this a build
          only produces a workflow artifact, which the website cannot see —
          the Pages generator is built purely from GitHub Releases.
        required: false
        type: boolean
        default: true
      trigger-pages:
        description: Send a repository_dispatch event to refresh GitHub Pages on success.
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.package-name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      actions: write
      id-token: write      # required by attest-build-provenance
      attestations: write  # required by attest-build-provenance

    # Never let a manual dispatch race the scheduled run of the same package.
    # cancel-in-progress stays false: these builds take hours and a half-built
    # package is worth less than a late one.
    concurrency:
      group: build-${{ inputs.package-name }}
      cancel-in-progress: false

    steps:
      - name: Install apt dependencies
        if: inputs.apt-packages != ''
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          # Mirrors for the riscv64 port are noticeably flakier than x86;
          # a bare apt-get failing the whole build is the single most common
          # transient failure we see, so retry both update and install.
          for attempt in 1 2 3; do
            if sudo apt-get update; then break; fi
            echo "apt-get update failed (attempt $attempt), retrying in 30s..." >&2
            sleep 30
          done
          for attempt in 1 2 3; do
            if sudo apt-get install -y ${{ inputs.apt-packages }}; then
              exit 0
            fi
            echo "apt-get install failed (attempt $attempt), retrying in 30s..." >&2
            sleep 30
          done
          echo "apt-get install failed after 3 attempts" >&2
          exit 1

      - name: Install Go toolchain
        if: inputs.go-version != ''
        run: |
          set -eu
          REQUESTED="${{ inputs.go-version }}"
          # Known-good pinned fallback: used if go.dev is unreachable or the
          # index format changes. Keep this at a version verified on riscv64.
          FALLBACK="go1.24.6"

          GO_VER="$REQUESTED"
          if [ "$REQUESTED" = "latest" ]; then
            GO_VER=$(curl -fsSL --retry 3 --retry-delay 5 'https://go.dev/dl/?mode=json' 2>/dev/null \
              | grep -o '"version"[[:space:]]*:[[:space:]]*"go[0-9.]*"' \
              | head -n1 \
              | grep -o 'go[0-9.]*' || true)
            if [ -z "$GO_VER" ]; then
              echo "Could not resolve latest Go version, falling back to $FALLBACK" >&2
              GO_VER="$FALLBACK"
            fi
          fi
          echo "Installing $GO_VER for riscv64"

          TARBALL="${GO_VER}.linux-riscv64.tar.gz"
          if ! curl -fsSL --retry 3 --retry-delay 10 -o "/tmp/${TARBALL}" \
               "https://go.dev/dl/${TARBALL}"; then
            echo "Download of $GO_VER failed, falling back to $FALLBACK" >&2
            GO_VER="$FALLBACK"
            TARBALL="${GO_VER}.linux-riscv64.tar.gz"
            curl -fsSL --retry 3 --retry-delay 10 -o "/tmp/${TARBALL}" \
              "https://go.dev/dl/${TARBALL}"
          fi

          # Remove apt's Go so a stale /usr/bin/go can't shadow ours.
          sudo apt-get remove -y golang golang-go golang-doc 2>/dev/null || true
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf "/tmp/${TARBALL}"

          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=/usr/local/go" >> "$GITHUB_ENV"
          /usr/local/go/bin/go version

      - name: Clean workspace with elevated permissions
        if: inputs.clean-workspace
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"

      - name: Checkout repo
        if: inputs.checkout
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Setup
        if: inputs.setup-script != ''
        run: ${{ inputs.setup-script }}

      - name: Record build environment
        uses: ./.github/actions/build-environment
        with:
          package-name: ${{ inputs.package-name }}

      - name: Build ${{ inputs.package-name }}
        run: ${{ inputs.build-script }}

      # Without this, a build-script that exits 0 but never sets ASSET_PATH
      # hands upload-artifact an empty name and fails with an unrelated error.
      # A build-script may stop early via skip-if-published.sh when the asset
      # it would produce is already published. That is a success with nothing
      # to upload, so everything downstream has to stand down too.
      - name: Verify build output
        if: env.SKIP_BUILD != 'true'
        run: |
          set -eu
          if [ -z "${ASSET_NAME:-}" ] || [ -z "${ASSET_PATH:-}" ]; then
            echo "::error::build-script did not export ASSET_NAME/ASSET_PATH to \$GITHUB_ENV" >&2
            exit 1
          fi
          if [ ! -f "$ASSET_PATH" ]; then
            echo "::error::ASSET_PATH does not exist: $ASSET_PATH" >&2
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::ASSET_PATH is empty: $ASSET_PATH" >&2
            exit 1
          fi
          echo "Staged $ASSET_NAME ($(du -h "$ASSET_PATH" | cut -f1))"

      - name: Upload artifact
        if: env.SKIP_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error
          retention-days: 90

      # Uploading a workflow artifact does not put a package on the website.
      # update-pages.yml is generated purely from GitHub *Releases*, so a build
      # that only produced an artifact would fire the Pages refresh below and
      # regenerate an identical page — which is exactly what made a manual
      # build appear to vanish.
      #
      # Publishing here composes with the monthly Central Release rather than
      # replacing it: that job keeps collecting the newest artifact per package
      # into its own curated release.
      # A stranger is being asked to untar this into /usr/local. Without a
      # checksum they cannot tell a good download from a truncated or swapped
      # one, and without provenance they cannot tell this archive's build from
      # anyone else's upload. Both are cheap; neither existed.
      - name: Checksum the asset
        if: success() && env.SKIP_BUILD != 'true'
        run: |
          set -eu
          cd "$(dirname "$ASSET_PATH")"
          sha256sum "$(basename "$ASSET_PATH")" > "${ASSET_NAME}.sha256"
          cat "${ASSET_NAME}.sha256"
          echo "ASSET_SHA256_PATH=$(pwd)/${ASSET_NAME}.sha256" >> "$GITHUB_ENV"
          {
            echo "### Checksum"
            echo
            echo '```'
            cat "${ASSET_NAME}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Signs a statement that this exact file came from this workflow, at this
      # commit, on this runner. Verifiable with:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        if: success() && inputs.publish-release && env.SKIP_BUILD != 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET_PATH }}

      - name: Resolve release date
        if: success() && inputs.publish-release && env.SKIP_BUILD != 'true'
        id: release-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Publish asset to the dated release
        if: success() && inputs.publish-release && env.SKIP_BUILD != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.release-date.outputs.date }}
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.ASSET_SHA256_PATH }}
          fail_on_unmatched_files: true
          # name and body are deliberately unset. On a day when Central Release
          # has already published, supplying either would overwrite its curated
          # notes; append_body only ever adds a line.
          append_body: true
          body: "- `${{ env.ASSET_NAME }}` — ${{ inputs.package-name }}"
          # The curated monthly release stays the one marked "Latest".
          make_latest: false

      - name: Trigger Pages update
        if: success() && inputs.trigger-pages && env.SKIP_BUILD != 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: update-pages
          repository: ${{ github.repository }}
