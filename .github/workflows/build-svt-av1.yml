# Overlay for SVT-AV1. Common scaffolding lives in _build-package.yaml.
#
# Why this package exists here:
#   Upstream publishes no binaries at all — the GitLab releases carry zero
#   assets for every architecture. Ubuntu 24.04 ships SVT-AV1 1.7.0 while
#   upstream is on 4.x: three major versions of encoder speed and quality work.
#
#   Be honest in the release notes about what this is: SVT-AV1 has no RISC-V
#   SIMD tier at all (Source/Lib has ASM_AVX2/AVX512/NEON/SVE/SSE* and
#   C_DEFAULT, no RISC-V), so riscv64 runs the portable C path. This is a
#   version win, not a vectorisation win.
name: Build SVT-AV1 for RISC-V

on:
  workflow_dispatch:
  schedule:
    - cron: "0 08 7 * *"

jobs:
  build:
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/_build-package.yaml
    with:
      package-name: SVT-AV1 RISC-V
      timeout-minutes: 90
      apt-packages: build-essential git cmake ninja-build pkg-config yasm file
      build-script: |
        set -eux
        SVT_REPO="https://gitlab.com/AOMediaCodec/SVT-AV1.git"

        VERSION=$(git ls-remote --tags --refs "$SVT_REPO" \
          | awk -F/ '{print $NF}' \
          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
          | sed 's/^v//' \
          | sort -V | tail -n1)
        [ -n "$VERSION" ] || { echo "Could not resolve an SVT-AV1 tag" >&2; exit 1; }
        echo "Latest SVT-AV1: $VERSION"

        rm -rf "$GITHUB_WORKSPACE/svtav1-src"
        git clone --depth=1 --branch "v${VERSION}" "$SVT_REPO" \
          "$GITHUB_WORKSPACE/svtav1-src"
        cd "$GITHUB_WORKSPACE/svtav1-src"

        PREFIX="$GITHUB_WORKSPACE/svtav1-install"
        rm -rf "$PREFIX"
        mkdir -p Build && cd Build

        cmake .. -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$PREFIX" \
          -DBUILD_SHARED_LIBS=ON \
          -DBUILD_TESTING=OFF
        ninja
        ninja install

        export LD_LIBRARY_PATH="$PREFIX/lib:${LD_LIBRARY_PATH:-}"
        "$PREFIX/bin/SvtAv1EncApp" --version
        file "$PREFIX/bin/SvtAv1EncApp" | grep -q "RISC-V" \
          || { echo "SvtAv1EncApp is not a RISC-V binary" >&2; exit 1; }

        ASSET_NAME="svt-av1-${VERSION}-riscv64-linux.tar.gz"
        ASSET_PATH="$GITHUB_WORKSPACE/${ASSET_NAME}"
        tar -czf "$ASSET_PATH" -C "$PREFIX" .

        echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
        echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"
      trigger-pages: true
