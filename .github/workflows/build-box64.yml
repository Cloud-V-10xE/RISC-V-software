# Overlay for box64. Common scaffolding lives in _build-package.yaml.
#
# Why this package exists here:
#   box64 is how RISC-V users run x86-64 Linux binaries at all — the answer to
#   "this proprietary tool has no RISC-V build". It is the most RISC-V-specific
#   package in this archive.
#
#   Upstream publishes NO host binary for any architecture: the v0.4.x releases
#   contain only bundles of x86 *libraries*, not box64 itself. Ubuntu 24.04 has
#   no box64 package at all, and Debian trixie carries 0.3.4 against upstream
#   0.4.x — which matters more than usual here, because PLCT Lab's RVV 1.0
#   work (100+ SSE instructions translated to RVV, reported ~300% gain over
#   scalar) landed in the 0.4 series.
name: Build box64 for RISC-V

on:
  workflow_dispatch:
  schedule:
    - cron: "0 02 10 * *"

jobs:
  build:
    permissions:
      contents: write
      actions: write
      id-token: write      # attest-build-provenance
      attestations: write  # attest-build-provenance
    uses: ./.github/workflows/_build-package.yaml
    with:
      package-name: box64 RISC-V
      timeout-minutes: 90
      apt-packages: build-essential git cmake ninja-build python3 file
      build-script: |
        set -eux
        BOX64_REPO="https://github.com/ptitSeb/box64.git"

        VERSION=$(git ls-remote --tags --refs "$BOX64_REPO" \
          | awk -F/ '{print $NF}' \
          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
          | sed 's/^v//' \
          | sort -V | tail -n1)
        [ -n "$VERSION" ] || { echo "Could not resolve a box64 tag" >&2; exit 1; }
        echo "Latest box64: $VERSION"

        rm -rf "$GITHUB_WORKSPACE/box64-src"
        git clone --depth=1 --branch "v${VERSION}" "$BOX64_REPO" \
          "$GITHUB_WORKSPACE/box64-src"
        cd "$GITHUB_WORKSPACE/box64-src"

        PREFIX="$GITHUB_WORKSPACE/box64-install"
        rm -rf "$PREFIX" build
        mkdir -p build && cd build

        # RV64=1 selects the RISC-V dynarec. Box32 (32-bit x86 support) is
        # bundled and off by default; RISC-V needs Box32 rather than the
        # separate box86 project, so enable it here.
        #
        # NO_CONF_INSTALL=ON is required, for two reasons. Upstream installs its
        # binfmt config to a hardcoded absolute /etc/binfmt.d/ that ignores
        # CMAKE_INSTALL_PREFIX, so `ninja install` fails as a non-root user with
        # "file cannot create directory: /etc/binfmt.d". And the config is
        # generated from ${CMAKE_INSTALL_PREFIX}/bin/box64 — which here is this
        # runner's throwaway build directory, so shipping it would hand users a
        # binfmt rule pointing at a path that does not exist on their machine.
        # The confs are regenerated below against the real install location.
        #
        # NO_LIB_INSTALL=ON is required for the same class of reason: the
        # bundled x86 libraries go to a hardcoded absolute
        # /usr/lib/box64-x86_64-linux-gnu (and .../box64-i386-linux-gnu), so the
        # install dies with "file cannot create directory: /usr/lib/box64-...".
        # Those two options together are the complete set — every remaining
        # install() destination in upstream's CMakeLists is relative to the
        # prefix. The files each option suppresses are restored below.
        cmake .. -G Ninja \
          -DRV64=1 \
          -DBOX32=1 \
          -DNO_CONF_INSTALL=ON \
          -DNO_LIB_INSTALL=ON \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_INSTALL_PREFIX="$PREFIX"
        ninja
        ninja install

        # NO_LIB_INSTALL also gates three helpers that were installing to
        # perfectly good relative paths, so put them back by hand.
        install -Dm755 "$GITHUB_WORKSPACE/box64-src/tests/box64-bash" \
                       "$PREFIX/bin/box64-bash"
        install -Dm755 "$GITHUB_WORKSPACE/box64-src/system/box64-python" \
                       "$PREFIX/bin/box64-python"
        install -Dm644 "$GITHUB_WORKSPACE/box64-src/system/sitecustomize.py" \
                       "$PREFIX/share/box64/sitecustomize.py"

        # The bundled x86_64/i386 libraries (~15 MB) let box64 run programs that
        # want libraries the host has no riscv64 equivalent for. Upstream wants
        # them at an absolute /usr/lib path that this relocatable tarball cannot
        # own, so ship them under the prefix and let BOX64_LD_LIBRARY_PATH find
        # them — see docs/packages/box64.md.
        for LIBDIR in x64lib x86lib; do
          if [ -d "$GITHUB_WORKSPACE/box64-src/${LIBDIR}" ]; then
            mkdir -p "$PREFIX/share/box64/${LIBDIR}"
            cp -a "$GITHUB_WORKSPACE/box64-src/${LIBDIR}/." \
                  "$PREFIX/share/box64/${LIBDIR}/"
          fi
        done

        # binfmt_misc registration — the thing that makes x86-64 binaries just
        # run. Written for /usr/local, which is where this tarball is meant to
        # be extracted, and placed in lib/binfmt.d because systemd-binfmt reads
        # /usr/local/lib/binfmt.d/ as well as /etc/binfmt.d/ (binfmt.d(5)).
        mkdir -p "$PREFIX/lib/binfmt.d"
        printf '%s\n' \
          '# Installed by RISC-V-software; see binfmt.d(5)' \
          ':box64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x3e\x00:\xff\xff\xff\xff\xff\xff\xff\x00\x00\x00\x00\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/local/bin/box64:' \
          > "$PREFIX/lib/binfmt.d/box64.conf"
        printf '%s\n' \
          '# Installed by RISC-V-software; see binfmt.d(5)' \
          ':box32:M::\x7fELF\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x03\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/local/bin/box64:' \
          > "$PREFIX/lib/binfmt.d/box32.conf"

        # Upstream's system-wide rc file is read from /etc/box64.box64rc, which
        # is outside this tarball's prefix, so ship it as a reference copy
        # rather than somewhere box64 will never look.
        mkdir -p "$PREFIX/share/box64"
        cp "$GITHUB_WORKSPACE/box64-src/system/box64.box64rc" \
           "$PREFIX/share/box64/box64.box64rc"

        "$PREFIX/bin/box64" --version 2>&1 | head -5 || true
        file "$PREFIX/bin/box64" | grep -q "RISC-V" \
          || { echo "box64 is not a RISC-V binary" >&2; exit 1; }

        ASSET_NAME="box64-${VERSION}-riscv64-linux.tar.gz"
        ASSET_PATH="$GITHUB_WORKSPACE/${ASSET_NAME}"
        tar -czf "$ASSET_PATH" -C "$PREFIX" .

        echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
        echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"
      trigger-pages: true
