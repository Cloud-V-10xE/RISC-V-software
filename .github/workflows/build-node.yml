# Overlay for Node.js. Common scaffolding lives in _build-package.yaml.
name: Build Nodejs for RISC-V

on:
  workflow_dispatch:
  schedule:
    - cron: "0 02 9 * *"

jobs:
  build:
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/_build-package.yaml
    with:
      package-name: Node.js RISC-V
      # V8 alone is a multi-hour compile on riscv64; the 360-minute job default
      # cut this off at 6h00m23s last cycle with the build still running.
      timeout-minutes: 720
      apt-packages: >-
        libatomic1 libtsan2 gcc-14 g++-14 rustup cmake build-essential
        libcurl4-openssl-dev wget ccache python3 file
      setup-script: |
        set -eux
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
        sudo ln -sf /usr/bin/gcc-14 /usr/bin/gcc
        sudo ln -sf /usr/bin/g++-14 /usr/bin/g++
        rustup install stable
        rustup default stable
        mkdir -p "$GITHUB_WORKSPACE/installed_binaries"
      build-script: |
        set -eux
        git config --global http.postBuffer 524288000
        git config --global http.maxRequests 2
        git config --global core.compression 0

        rm -rf "$GITHUB_WORKSPACE/node"
        git clone --depth=1 --no-tags https://github.com/nodejs/node.git "$GITHUB_WORKSPACE/node"
        cd "$GITHUB_WORKSPACE/node"

        git fetch --tags --depth=1
        # Strict vX.Y.Z only — a bare "v*" also matches -rc / -nightly tags and
        # we do not want to publish a release candidate as the month's Node.
        LATEST_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
        [ -n "$LATEST_TAG" ] || { echo "No stable Node tag found" >&2; exit 1; }
        echo "Checking out $LATEST_TAG"
        git fetch --depth=1 origin tag "$LATEST_TAG"
        git checkout FETCH_HEAD

        # ccache was already being installed but never wired up. Keep the cache
        # outside $GITHUB_WORKSPACE so it survives the workspace wipe and gives
        # the next monthly run a warm start.
        export CCACHE_DIR="$HOME/.ccache"
        export CC="ccache gcc-14"
        export CXX="ccache g++-14"
        ccache -M 15G
        ccache -z

        ./configure \
          --prefix="$GITHUB_WORKSPACE/installed_binaries" \
          --openssl-no-asm \
          --dest-cpu=riscv64
        make -j"$(nproc)"
        make install

        ccache -s || true

        "$GITHUB_WORKSPACE/installed_binaries/bin/node" -v
        file "$GITHUB_WORKSPACE/installed_binaries/bin/node"

        NODE_VERSION=$("$GITHUB_WORKSPACE/installed_binaries/bin/node" -v | cut -c 2-)
        ASSET_NAME="nodejs-${NODE_VERSION}-riscv64-linux.tar.gz"
        ASSET_PATH="$GITHUB_WORKSPACE/${ASSET_NAME}"
        tar -czf "$ASSET_PATH" -C "$GITHUB_WORKSPACE/installed_binaries" .

        echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
        echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"
      trigger-pages: true
