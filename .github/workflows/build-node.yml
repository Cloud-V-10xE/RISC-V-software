# Overlay for Node.js. Common scaffolding lives in _build-package.yaml.
name: Build Nodejs for RISC-V

on:
  workflow_dispatch:
  schedule:
    - cron: "0 02 9 * *"

jobs:
  build:
    permissions:
      contents: write
      actions: write
      id-token: write      # attest-build-provenance
      attestations: write  # attest-build-provenance
    uses: ./.github/workflows/_build-package.yaml
    with:
      package-name: Node.js RISC-V
      # V8 alone is a multi-hour compile on riscv64; the 360-minute job default
      # cut this off at 6h00m23s last cycle with the build still running.
      timeout-minutes: 720
      apt-packages: >-
        libatomic1 libtsan2 gcc-14 g++-14 rustup cmake build-essential
        libcurl4-openssl-dev wget ccache python3 file xz-utils jq
      setup-script: |
        set -eux
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
        sudo ln -sf /usr/bin/gcc-14 /usr/bin/gcc
        sudo ln -sf /usr/bin/g++-14 /usr/bin/g++
        rustup install stable
        rustup default stable
        mkdir -p "$GITHUB_WORKSPACE/installed_binaries"
      build-script: |
        set -eux

        # ── Which Node to build ────────────────────────────────────────────
        # Policy: track the active LTS line. If it has moved since we last
        # published, build that. Otherwise spend the slot on the newest
        # release instead of rebuilding an LTS we already ship.
        #
        # Resolution comes from nodejs.org/dist/index.json, not from git tags,
        # because only the dist index records which releases are LTS. The old
        # `git tag -l | sort -V | tail -1` had no notion of it and simply took
        # the highest major, which is how this archive ended up publishing
        # 25.x — the Current line, which never becomes LTS and stops getting
        # fixes as soon as the next major ships.
        DIST=$(curl -fsSL --retry 5 --retry-delay 10 https://nodejs.org/dist/index.json)

        # "lts" is false for Current releases and a codename ("Krypton") for
        # LTS ones. Sorted here rather than trusting the file's ordering.
        LTS_VERSION=$(echo "$DIST" | jq -r '.[] | select(.lts != false) | .version' \
          | sed 's/^v//' | sort -V | tail -n1)
        LATEST_VERSION=$(echo "$DIST" | jq -r '.[].version' \
          | sed 's/^v//' | sort -V | tail -n1)
        [ -n "$LTS_VERSION" ] && [ -n "$LATEST_VERSION" ] \
          || { echo "Could not resolve Node versions from the dist index" >&2; exit 1; }
        echo "Active LTS: ${LTS_VERSION} | newest release: ${LATEST_VERSION}"

        # What this archive already ships, read from the asset filenames. The
        # call is deliberately unauthenticated: the repository is public, and
        # exposing a repo-write token to a build script that then runs upstream
        # build systems is not a trade worth making for one API lookup.
        PUBLISHED=$(curl -fsSL --retry 3 --retry-delay 5 \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
          | jq -r '[.[].assets[].name | select(test("^nodejs-[0-9]"))] | .[]' \
          | sed -E 's/^nodejs-([0-9][^-]*)-.*$/\1/' | sort -uV || true)
        echo "Already published: ${PUBLISHED:-<none>}"

        if echo "$PUBLISHED" | grep -qx -- "$LTS_VERSION"; then
          VERSION="$LATEST_VERSION"
          REASON="LTS ${LTS_VERSION} is already published; building the newest release instead"
        else
          VERSION="$LTS_VERSION"
          REASON="new release on the LTS line"
        fi
        echo "Building Node ${VERSION} — ${REASON}"
        # Nothing to do if this exact Node is already published.
        . "$GITHUB_WORKSPACE/.github/scripts/skip-if-published.sh" \
            "nodejs-${VERSION}-riscv64-linux.tar.gz"

        # ── Fetch the source ───────────────────────────────────────────────
        # Release tarball rather than a git clone: it is the exact version
        # resolved above, it is ~55 MB instead of a full history, and it needs
        # none of the http.postBuffer/compression tuning the clone required.
        SRC="$GITHUB_WORKSPACE/node"
        TARBALL="$GITHUB_WORKSPACE/node-v${VERSION}.tar.xz"
        rm -rf "$SRC" "$TARBALL"

        curl -fL -C - --retry 5 --retry-delay 10 --retry-all-errors \
             --connect-timeout 30 -o "$TARBALL" \
             "https://nodejs.org/dist/v${VERSION}/node-v${VERSION}.tar.xz"
        # Catches a transfer that was cut short before it reaches the compiler.
        tar -tf "$TARBALL" > /dev/null

        mkdir -p "$SRC"
        tar -xf "$TARBALL" -C "$SRC" --strip-components=1
        rm -f "$TARBALL"
        cd "$SRC"

        # ── V8 riscv64: FloatMinMaxHelper has no external linkage ──────────
        # V8 defines MacroAssembler::FloatMinMaxHelper as a template in
        # macro-assembler-riscv.cc and instantiates it only implicitly, from
        # uses inside that same file. From Node 26 onward maglev calls it from
        # maglev-ir-riscv.cc, so the link fails:
        #
        #   maglev-ir-riscv.o: undefined reference to
        #   `void v8::internal::MacroAssembler::FloatMinMaxHelper<double>(...)'
        #
        # Node 24 LTS is unaffected — its maglev never calls it. Upstream has
        # not fixed this on main as of this writing.
        #
        # The patch is deliberately conditional on the bug still being present:
        # if upstream adds the instantiation, or maglev stops calling it, both
        # guards go false and nothing is applied. Nothing here needs removing
        # when that happens.
        MA_FILE="deps/v8/src/codegen/riscv/macro-assembler-riscv.cc"
        MAGLEV_FILE="deps/v8/src/maglev/riscv/maglev-ir-riscv.cc"
        if [ -f "$MA_FILE" ] && [ -f "$MAGLEV_FILE" ] \
           && grep -q 'FloatMinMaxHelper' "$MAGLEV_FILE" \
           && ! grep -qE '^template void MacroAssembler::FloatMinMaxHelper' "$MA_FILE"; then
          echo "Patching $MA_FILE: adding explicit FloatMinMaxHelper instantiations"

          # printf rather than a heredoc: a heredoc body has to sit at column 0,
          # which would terminate this YAML block scalar.
          PATCH_TMP="$(mktemp)"
          {
            printf '%s\n' ''
            printf '%s\n' '// Added by Cloud-V-10xE/RISC-V-software. V8 instantiates this template'
            printf '%s\n' '// only implicitly within this translation unit, so maglev callers cannot'
            printf '%s\n' '// link against it. Both specialisations are already used above, so naming'
            printf '%s\n' '// them here changes no codegen - it only gives them external linkage.'
            printf '%s\n' 'template void MacroAssembler::FloatMinMaxHelper<float>('
            printf '%s\n' '    FPURegister, FPURegister, FPURegister, MaxMinKind);'
            printf '%s\n' 'template void MacroAssembler::FloatMinMaxHelper<double>('
            printf '%s\n' '    FPURegister, FPURegister, FPURegister, MaxMinKind);'
          } > "$PATCH_TMP"

          # Insert before the trailing `#undef __` so the definitions land
          # inside namespace v8::internal, where the template was declared.
          awk -v pf="$PATCH_TMP" '
            /^#undef __$/ && !done { while ((getline l < pf) > 0) print l; done = 1 }
            { print }
          ' "$MA_FILE" > "${MA_FILE}.patched"
          mv "${MA_FILE}.patched" "$MA_FILE"
          rm -f "$PATCH_TMP"

          # A patch that silently fails to apply would waste four hours and
          # then fail at exactly the same link step.
          grep -qE '^template void MacroAssembler::FloatMinMaxHelper<double>' "$MA_FILE" \
            || { echo "::error::FloatMinMaxHelper patch did not apply" >&2; exit 1; }
          echo "Patch applied."
        else
          echo "FloatMinMaxHelper patch not needed for this source tree."
        fi

        # ccache was already being installed but never wired up. Keep the cache
        # outside $GITHUB_WORKSPACE so it survives the workspace wipe and gives
        # the next monthly run a warm start.
        export CCACHE_DIR="$HOME/.ccache"

        # V8 vendors Google Highway and its JSON stringifier asks for a 16-lane
        # tag. Highway switches its EMU128 fallback off for GCC older than 16
        # (a GCC vectoriser bug, fixed in 12.3 — Highway blocks conservatively),
        # so on riscv64, where no RVV target is attainable either, the only
        # target left is HWY_SCALAR. Its FixedTag holds exactly one lane, and
        # the build dies with:
        #   error: no matching function for call to
        #   'Set(hwy::N_SCALAR::FixedTag<unsigned char, 16>&, int)'
        #
        # EMU128 is portable C++ with no intrinsics, so re-enabling it gives
        # back 16-lane tags without assuming any vector hardware. That matters
        # here: SG2042 implements RVV 0.7.1, not the RVV 1.0 Highway requires,
        # so -march=rv64gcv would produce binaries the build host cannot run.
        #
        # Set on CXX as well as CXXFLAGS because gyp does not thread every
        # environment variable through to every target, and one C++ file
        # compiled without these defines is enough to fail the build.
        HWY_FLAGS="-DHWY_BROKEN_EMU128=0 -DHWY_COMPILE_ONLY_EMU128"
        export CC="ccache gcc-14"
        export CXX="ccache g++-14 ${HWY_FLAGS}"
        export CXXFLAGS="${CXXFLAGS:-} ${HWY_FLAGS}"
        ccache -M 15G
        ccache -z

        ./configure \
          --prefix="$GITHUB_WORKSPACE/installed_binaries" \
          --openssl-no-asm \
          --dest-cpu=riscv64
        make -j"$(nproc)"
        make install

        ccache -s || true

        "$GITHUB_WORKSPACE/installed_binaries/bin/node" -v
        file "$GITHUB_WORKSPACE/installed_binaries/bin/node"

        # Version taken from the binary itself, not from the variable above, so
        # the filename can never claim something the artifact is not. They must
        # agree; if they do not, the source tree was not what we asked for.
        NODE_VERSION=$("$GITHUB_WORKSPACE/installed_binaries/bin/node" -v | cut -c 2-)
        [ "$NODE_VERSION" = "$VERSION" ] || {
          echo "Built Node ${NODE_VERSION} but requested ${VERSION}" >&2
          exit 1
        }

        # Whether this build is LTS is worth recording somewhere durable — the
        # version number alone only tells you if you happen to know that Node's
        # even majors are the LTS ones.
        if [ "$VERSION" = "$LTS_VERSION" ]; then
          NODE_LINE="LTS"
        else
          NODE_LINE="Current (not LTS)"
        fi
        {
          echo "### Node.js ${NODE_VERSION}"
          echo
          echo "- Line: **${NODE_LINE}**"
          echo "- Active LTS at build time: ${LTS_VERSION}"
          echo "- Newest release at build time: ${LATEST_VERSION}"
          echo "- Selected because: ${REASON}"
        } >> "$GITHUB_STEP_SUMMARY"

        ASSET_NAME="nodejs-${NODE_VERSION}-riscv64-linux.tar.gz"
        ASSET_PATH="$GITHUB_WORKSPACE/${ASSET_NAME}"
        tar -czf "$ASSET_PATH" -C "$GITHUB_WORKSPACE/installed_binaries" .

        echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
        echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"
      trigger-pages: true
