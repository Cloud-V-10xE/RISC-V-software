# Overlay for Nim. Common scaffolding lives in _build-package.yaml.
#
# Why this package exists here:
#   Nim publishes no riscv64 binary through ANY channel — not the release
#   downloads on nim-lang.org (x86_64/x86/ARM64/ARMv7l only), not the
#   nim-lang/nightlies builds, and not choosenim (which is Linux-amd64 only,
#   so even a published tarball would not be installable the normal way).
#   nim-lang/nightlies#113 asks for exactly this and has sat unanswered.
#
#   Meanwhile the compiler needs zero patches: compiler/installer.ini already
#   lists riscv64, and csources_v2/build.sh has a native riscv64 branch, so
#   the bootstrap is a solved problem.
#
#   Ubuntu 24.04 riscv64 ships Nim 1.6.14 — a whole major version behind — and
#   even Ubuntu 26.04 only reaches 2.2.4.
name: Build Nim for RISC-V

on:
  workflow_dispatch:
  schedule:
    - cron: "0 02 11 * *"

jobs:
  build:
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/_build-package.yaml
    with:
      package-name: Nim RISC-V
      timeout-minutes: 240
      apt-packages: build-essential git ca-certificates file
      build-script: |
        set -eux
        NIM_REPO="https://github.com/nim-lang/Nim.git"

        VERSION=$(git ls-remote --tags --refs "$NIM_REPO" \
          | awk -F/ '{print $NF}' \
          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
          | sed 's/^v//' \
          | sort -V | tail -n1)
        [ -n "$VERSION" ] || { echo "Could not resolve a Nim tag" >&2; exit 1; }
        echo "Latest Nim: $VERSION"

        rm -rf "$GITHUB_WORKSPACE/nim-src"
        git clone --depth=1 --branch "v${VERSION}" "$NIM_REPO" \
          "$GITHUB_WORKSPACE/nim-src"
        cd "$GITHUB_WORKSPACE/nim-src"

        # build_all.sh fetches csources_v2 (pre-generated C, so only a C
        # compiler is needed — no chicken-and-egg), builds the bootstrap
        # compiler, then koch-boots the real one plus the tooling.
        sh build_all.sh

        ./bin/nim --version
        file ./bin/nim | grep -q "RISC-V" \
          || { echo "nim is not a RISC-V binary" >&2; exit 1; }

        # Prove the toolchain can actually compile and run something, not just
        # that the binary starts.
        cat > /tmp/hello.nim <<'NIMEOF'
        echo "nim on riscv64: ", hostCPU, "/", hostOS
        NIMEOF
        ./bin/nim c --hints:off -o:/tmp/hello /tmp/hello.nim
        /tmp/hello

        PREFIX="$GITHUB_WORKSPACE/nim-install"
        rm -rf "$PREFIX"
        mkdir -p "$PREFIX"
        # Ship the layout Nim's own tarballs use: bin/, lib/, config/ and the
        # companion tools (nimble, nimsuggest, nimpretty) koch just built.
        cp -a bin lib config "$PREFIX/"
        [ -d tools ] && cp -a tools "$PREFIX/" || true

        ASSET_NAME="nim-${VERSION}-riscv64-linux.tar.gz"
        ASSET_PATH="$GITHUB_WORKSPACE/${ASSET_NAME}"
        tar -czf "$ASSET_PATH" -C "$PREFIX" .

        echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
        echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"
      trigger-pages: true
