# Overlay for FFmpeg. Common scaffolding lives in _build-package.yaml.
#
# Why this package exists here:
#   No prebuilt riscv64 FFmpeg exists anywhere. All three canonical static-build
#   providers ship x86_64 and arm64 only — BtbN/FFmpeg-Builds, John Van Sickle,
#   and eugeneware/ffmpeg-static.
#
#   The version gap is severe and measurable. Ubuntu 24.04 riscv64 is frozen at
#   FFmpeg 6.1.1 (no noble-updates entry) while upstream is on 9.x, and the
#   RISC-V vector assembly grew from 30 files in libavcodec/riscv at n6.1 to
#   ~102 at n8.1. That work — largely by Rémi Denis-Courmont, with SiFive and
#   RISE funding H.264/HEVC/VVC kernels — shows 4x-20x checkasm speedups on
#   K230 and BananaPi F3 hardware. Building from source ships roughly 3.4x more
#   RISC-V-optimised code than the distro package.
name: Build FFmpeg for RISC-V

on:
  workflow_dispatch:
  schedule:
    - cron: "0 02 12 * *"

jobs:
  build:
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/_build-package.yaml
    with:
      package-name: FFmpeg RISC-V
      timeout-minutes: 300
      apt-packages: >-
        build-essential git pkg-config yasm nasm file xz-utils
        libx264-dev libx265-dev libvpx-dev libdav1d-dev libaom-dev
        libopus-dev libvorbis-dev libmp3lame-dev
        libass-dev libfreetype6-dev libfontconfig1-dev
        libssl-dev zlib1g-dev libbz2-dev liblzma-dev
        libsvtav1enc-dev librav1e-dev
      build-script: |
        set -eux

        # Release tarball, not `git clone https://git.ffmpeg.org/ffmpeg.git`.
        # That clone kept dying part-way through the pack transfer:
        #   error: RPC failed; curl 18 transfer closed with outstanding read data
        #   fetch-pack: unexpected disconnect while reading sideband packet
        # git cannot resume a broken pack — it starts the whole transfer again —
        # whereas ffmpeg.org serves the 12 MB tarball with range support, so
        # curl resumes instead of restarting. Version resolution moves to the
        # same host, which drops git.ffmpeg.org from the build entirely.
        VERSION=$(curl -fsSL --retry 5 --retry-delay 10 https://ffmpeg.org/releases/ \
          | grep -oE 'ffmpeg-[0-9]+\.[0-9]+(\.[0-9]+)?\.tar\.xz' \
          | sed 's/^ffmpeg-//;s/\.tar\.xz$//' \
          | sort -uV | tail -n1)
        [ -n "$VERSION" ] || { echo "Could not resolve an FFmpeg release" >&2; exit 1; }
        echo "Latest FFmpeg: $VERSION"

        SRC="$GITHUB_WORKSPACE/ffmpeg-src"
        TARBALL="$GITHUB_WORKSPACE/ffmpeg-${VERSION}.tar"
        rm -rf "$SRC" "$TARBALL"

        # `-C -` resumes a partial file rather than starting over, which is the
        # whole point on a link that drops mid-transfer. GitHub's mirror of the
        # release tag is the fallback for when ffmpeg.org is down outright.
        # `tar -tf` validates both compression and archive structure, and works
        # for the .xz and the .gz without caring which one we ended up with.
        for URL in "https://ffmpeg.org/releases/ffmpeg-${VERSION}.tar.xz" \
                   "https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/n${VERSION}"; do
          echo "Fetching ${URL}"
          if curl -fL -C - --retry 5 --retry-delay 10 --retry-all-errors \
                  --connect-timeout 30 -o "$TARBALL" "$URL" \
             && tar -tf "$TARBALL" > /dev/null; then
            echo "Got a complete tarball from ${URL}"
            break
          fi
          echo "${URL} did not yield a usable tarball; trying the next source"
          rm -f "$TARBALL"
        done
        [ -s "$TARBALL" ] || { echo "No source served a complete FFmpeg tarball" >&2; exit 1; }

        # --strip-components=1 normalises the two layouts: ffmpeg.org gives
        # ffmpeg-<version>/ and GitHub gives FFmpeg-n<version>/.
        mkdir -p "$SRC"
        tar -xf "$TARBALL" -C "$SRC" --strip-components=1
        rm -f "$TARBALL"
        cd "$SRC"

        echo "RISC-V asm files present:"
        for d in libavcodec libavutil libswscale libavfilter; do
          n=$(ls "$d/riscv" 2>/dev/null | wc -l)
          echo "  $d/riscv: $n"
        done

        PREFIX="$GITHUB_WORKSPACE/ffmpeg-install"
        rm -rf "$PREFIX"

        # Deliberately NO --cpu= and no -march=rv64gcv.
        #
        # FFmpeg gates every RVV routine behind `.option arch, +v` in the
        # assembly plus runtime hwprobe/AT_HWCAP detection, so the generic
        # build is fast on RVV-1.0 parts (K230, SpacemiT K1) *and* still runs
        # on T-Head XTheadVector 0.7.1 boards (StarFive JH7110 / VisionFive 2,
        # Allwinner D1) where forcing +v at compile time would SIGILL. Those
        # are the most widely deployed RISC-V SBCs, so portability wins.
        # GPL + version3 only. Deliberately NOT --enable-nonfree: that flag
        # (and libfdk-aac, which requires it) produces a binary that cannot be
        # legally redistributed, which would make the whole release unusable
        # for this project's purpose. AAC encoding uses FFmpeg's native encoder.
        ./configure \
          --prefix="$PREFIX" \
          --enable-gpl \
          --enable-version3 \
          --enable-shared \
          --enable-libx264 \
          --enable-libx265 \
          --enable-libvpx \
          --enable-libdav1d \
          --enable-libaom \
          --enable-libsvtav1 \
          --enable-librav1e \
          --enable-libopus \
          --enable-libvorbis \
          --enable-libmp3lame \
          --enable-libass \
          --enable-libfreetype \
          --enable-libfontconfig \
          --enable-openssl \
          --enable-runtime-cpudetect

        # Assert RVV actually got enabled. An assembler too old for
        # `.option arch, +v` degrades silently to a scalar build that still
        # reports success, so check the generated config rather than trusting
        # the exit code.
        if grep -q '^#define HAVE_RVV 1' ffbuild/config.h; then
          echo "RVV enabled"
        else
          echo "::error::RVV is NOT enabled — the assembler likely does not support '.option arch, +v'."
          echo "Shipping this would be a scalar build masquerading as an optimised one."
          exit 1
        fi

        make -j"$(nproc)"
        make install

        export LD_LIBRARY_PATH="$PREFIX/lib:${LD_LIBRARY_PATH:-}"
        "$PREFIX/bin/ffmpeg" -version
        "$PREFIX/bin/ffmpeg" -hide_banner -buildconf | head -40
        file "$PREFIX/bin/ffmpeg" | grep -q "RISC-V" \
          || { echo "ffmpeg is not a RISC-V binary" >&2; exit 1; }

        ASSET_NAME="ffmpeg-${VERSION}-riscv64-linux.tar.gz"
        ASSET_PATH="$GITHUB_WORKSPACE/${ASSET_NAME}"
        tar -czf "$ASSET_PATH" -C "$PREFIX" .

        echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
        echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"
      trigger-pages: true
