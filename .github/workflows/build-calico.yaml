# Overlay for Calico. Common scaffolding lives in _build-package.yaml.
name: Build Calico for RISC-V

on:
  workflow_dispatch:
  # `push: tags: ['v*']` was removed: any v* tag landing in this repo (they are
  # not Calico versions) started an unrelated 3h Calico build. Scheduled and
  # manual runs are the only ones that make sense here.
  schedule:
    - cron: "0 02 24 * *"

jobs:
  build:
    permissions:
      contents: write
      actions: write
      id-token: write      # attest-build-provenance
      attestations: write  # attest-build-provenance
    uses: ./.github/workflows/_build-package.yaml
    with:
      package-name: Calico RISC-V
      # # RISE CI enablement project — stays on RISE's Scaleway EM-RV1 fleet
      # # rather than the default self-hosted RISCV64 runners.
      # runner: ubuntu-24.04-riscv
      apt-packages: >-
        build-essential clang llvm libbpf-dev libnftnl-dev
        iptables libxtables-dev libiptc-dev pkg-config
        libpcap-dev libelf-dev linux-libc-dev xz-utils jq
      go-version: latest
      timeout-minutes: 180
      build-script: |
        set -eux

        # Latest STABLE release, not master. This used to track master
        # unconditionally, which is a real risk for a component headed into a
        # production Kubernetes control plane — master sits mid-development
        # between releases. GitHub's "latest release" endpoint already excludes
        # prereleases/drafts, so this is one call, no filtering needed.
        #
        # This tag is also the one build-calico-felix.yaml reads back (from
        # THIS repo's own published asset name, not by independently re-resolving
        # "latest" itself) so that Felix always matches the exact Calico version
        # shipped here — the two must never drift, since a version-mismatched
        # Felix running against a different calicoctl/typha is a real
        # compatibility risk. If you change how this resolves, keep that in mind.
        CALICO_TAG=$(curl -fsSL --retry 5 --retry-delay 10 \
          "https://api.github.com/repos/projectcalico/calico/releases/latest" \
          | jq -r '.tag_name')
        [ -n "$CALICO_TAG" ] && [ "$CALICO_TAG" != "null" ] \
          || { echo "Could not resolve the latest stable Calico release" >&2; exit 1; }
        CALICO_VERSION="${CALICO_TAG#v}"
        echo "Latest stable Calico release: ${CALICO_TAG}"

        . "$GITHUB_WORKSPACE/.github/scripts/skip-if-published.sh" \
            "calico-${CALICO_VERSION}-riscv64-linux.tar.gz"

        # GitHub's auto-generated source tarball rather than a git clone: Calico
        # is a large monorepo and cloning it was a real source of flaky
        # "RPC failed; HTTP 429" / mid-transfer failures elsewhere in this
        # archive. codeload.github.com does not honour Range on these archives
        # (confirmed — a ranged request still returns the full body), so this
        # does not get true resume, but it avoids git's protocol-level failure
        # modes entirely, and `tar -tf` below still catches a truncated file.
        SRC="$GITHUB_WORKSPACE/calico"
        TARBALL="$GITHUB_WORKSPACE/calico-${CALICO_TAG}.tar.gz"
        rm -rf "$SRC" "$TARBALL"

        curl -fL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 \
             -o "$TARBALL" \
             "https://github.com/projectcalico/calico/archive/refs/tags/${CALICO_TAG}.tar.gz"
        tar -tf "$TARBALL" > /dev/null

        mkdir -p "$SRC"
        tar -xf "$TARBALL" -C "$SRC" --strip-components=1
        rm -f "$TARBALL"
        cd "$SRC"

        mkdir -p "$GITHUB_WORKSPACE/installed_binaries"

        # Fails loudly on a missing path rather than skipping it: a silent skip
        # here is exactly how calicoctl and typha ended up quietly absent from
        # every published tarball for months after upstream moved their build
        # paths — the workflow kept reporting success the whole time. A wrong
        # path should break the build, not ship an incomplete package.
        build_binary() {
          local output_name="$1"
          local target="$2"
          if [ ! -d "$target" ] && [ ! -f "$target" ]; then
            echo "::error::Source path '$target' for $output_name not found — upstream may have moved it again. Check the real tagged release tree, not master." >&2
            exit 1
          fi
          GOOS=linux GOARCH=riscv64 CGO_ENABLED=0 go build -o "$GITHUB_WORKSPACE/installed_binaries/$output_name" "$target"
        }

        # Pure-Go components — build the actual main packages explicitly when present.
        # CGO_ENABLED=0 is a deliberate choice for these four, not a workaround for
        # a blocker: felix/bpf/libbpf (which the node/CLI packages transitively
        # import) ships a `//go:build !cgo` stub specifically so a cgo-disabled
        # build still compiles and runs — see felix/bpf/libbpf/libbpf_stub.go
        # upstream. None of these four binaries need real BPF capability, so the
        # simpler, faster, pure-Go build is the right one for them.
        #
        # Paths verified against the real tagged release tree, not assumed from
        # a master-branch reading — master has since restructured towards a
        # single `cmd/calico` combined binary that does not exist in any tagged
        # release yet (see build-calico-node.yaml/build-calico-cni.yaml's
        # comments). At a real release, calicoctl lives at calicoctl/calicoctl
        # (a single-file main package alongside commands/resourcemgr/util
        # subpackages) and Typha's entry point is typha/cmd/calico-typha, not
        # typha/cmd/typha. The previous ./cmd/calico and ./typha/cmd/typha paths
        # do not exist in any release tag, so build_binary's silent skip-if-
        # missing fallback was quietly omitting both calicoctl and typha from
        # every published tarball — confirmed against the already-published
        # calico-3.32.2-riscv64-linux.tar.gz, which contains only
        # kube-controllers and cni-plugin. All four paths below were verified
        # with a real `go build` against the v3.32.2 tag before this fix.
        build_binary calicoctl ./calicoctl/calicoctl
        build_binary cni-plugin ./cni-plugin/cmd/calico
        build_binary kube-controllers ./kube-controllers/cmd/kube-controllers
        build_binary typha ./typha/cmd/calico-typha

        # apiserver is no longer a standalone main package upstream — its server
        # logic (apiserver/cmd/apiserver/server) is now built directly into
        # cmd/calico (see cmd/calico/apiserver.go), so it's already part of the
        # calicoctl binary above.

        # Felix is built separately by build-calico-felix.yaml, not here. Its
        # production build links a real, natively-compiled libbpf via CGO — a
        # heavier, slower, more failure-prone process (a C toolchain, not just
        # `go build`) than the four pure-Go binaries above, and it deliberately
        # has its own failure domain: a Felix build going wrong should not take
        # calicoctl/cni-plugin/kube-controllers/typha down with it, or vice versa.
        # That workflow reads the version published here (not upstream "latest")
        # so the two always ship in lockstep.

        "$GITHUB_WORKSPACE/installed_binaries/calicoctl" version || true

        ASSET_NAME="calico-${CALICO_VERSION}-riscv64-linux.tar.gz"
        ASSET_PATH="$GITHUB_WORKSPACE/${ASSET_NAME}"
        tar -czf "$ASSET_PATH" -C "$GITHUB_WORKSPACE/installed_binaries" .

        echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
        echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"
      trigger-pages: true