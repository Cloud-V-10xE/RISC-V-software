# Overlay for Calico. Common scaffolding lives in _build-package.yaml.
name: Build Calico for RISC-V

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: "0 0 * * 0"   # weekly — calico cuts releases often, adjust as needed

jobs:
  build:
    uses: ./.github/workflows/_build-package.yaml
    with:
      package-name: Calico RISC-V
      # runner: RISCV64
      apt-packages: >-
        build-essential golang clang llvm libbpf-dev libnftnl-dev
        iptables libxtables-dev libiptc-dev pkg-config
        libpcap-dev libelf-dev linux-libc-dev
      build-script: |
        set -eux
        git config --global http.postBuffer 524288000
        git config --global http.maxRequests 2
        git config --global core.compression 0

        CALICO_REPO="https://github.com/projectcalico/calico"
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          CALICO_REF="$GITHUB_REF_NAME"
        else
          CALICO_REF="master"
        fi

        rm -rf "$GITHUB_WORKSPACE/calico"
        git clone --depth=1 --branch "$CALICO_REF" "$CALICO_REPO" "$GITHUB_WORKSPACE/calico"
        cd "$GITHUB_WORKSPACE/calico"

        CALICO_VERSION="$(git describe --tags --always)"
        mkdir -p "$GITHUB_WORKSPACE/installed_binaries"

        build_binary() {
          local output_name="$1"
          local target="$2"
          if [ -d "$target" ] || [ -f "$target" ]; then
            GOOS=linux GOARCH=riscv64 CGO_ENABLED=1 go build -o "$GITHUB_WORKSPACE/installed_binaries/$output_name" "$target"
          else
            echo "Skipping $output_name: source path '$target' not found" >&2
          fi
        }

        # Pure-Go components — build the actual main packages explicitly when present
        build_binary calicoctl ./cmd/calico
        build_binary cni-plugin ./cni-plugin/cmd/calico
        build_binary kube-controllers ./kube-controllers/cmd/kube-controllers
        build_binary typha ./typha/cmd/typha
        build_binary apiserver ./apiserver/cmd/apiserver

        # Felix is currently skipped because its BPF build path requires extra
        # native libbpf support that is not available in this runner environment.
        echo "Skipping Felix build because the libbpf-based BPF path is not available in this environment" >&2

        "$GITHUB_WORKSPACE/installed_binaries/calicoctl" version || true

        BINUTILS_STYLE_VERSION="${CALICO_VERSION#v}"
        ASSET_NAME="calico-${BINUTILS_STYLE_VERSION}-riscv64-linux.tar.gz"
        ASSET_PATH="$GITHUB_WORKSPACE/${ASSET_NAME}"
        tar -czf "$ASSET_PATH" -C "$GITHUB_WORKSPACE/installed_binaries" .

        echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
        echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"
      trigger-pages: true