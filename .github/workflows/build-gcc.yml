# Overlay for GCC. Common scaffolding lives in _build-package.yaml.
name: Build GCC for RISC-V

on:
  workflow_dispatch:
  schedule:
    - cron: "0 02 13 * *"

jobs:
  build:
    permissions:
      contents: write
      actions: write
      id-token: write      # attest-build-provenance
      attestations: write  # attest-build-provenance
    uses: ./.github/workflows/_build-package.yaml
    with:
      package-name: GCC RISC-V
      # Even with the trimmed configure below this is a multi-hour build, and
      # the job default (360) killed it mid-link last cycle.
      timeout-minutes: 600
      apt-packages: build-essential libatomic1 flex bison libgmp-dev libmpfr-dev libmpc-dev xz-utils
      setup-script: |
        set -eux
        mkdir -p "$GITHUB_WORKSPACE/installed_binaries"
      build-script: |
        set -eux

        # Release tarball, not `git clone https://gcc.gnu.org/git/gcc.git`.
        # That clone is several hundred MB even with --depth=1, and gcc.gnu.org
        # rate-limits it — the previous run died on the clone with:
        #   error: RPC failed; HTTP 429 curl 22 The requested URL returned error: 429
        # The tarball is ~107 MB, is mirrored in several places, and needs no
        # git at all. The http.postBuffer/compression tuning that used to be
        # here was only ever nursing that clone along, so it is gone too.
        GCC_RELEASE=$(curl -fsSL --retry 5 --retry-delay 10 https://ftp.gnu.org/gnu/gcc/ \
          | grep -oE 'gcc-[0-9]+\.[0-9]+\.[0-9]+/' \
          | tr -d '/' | sed 's/^gcc-//' | sort -uV | tail -n1)
        [ -n "$GCC_RELEASE" ] || { echo "Could not resolve a GCC release" >&2; exit 1; }
        echo "Latest GCC release: $GCC_RELEASE"
        # GCC re-cuts the same version more than once; a rebuild of an already-published release costs ten hours of the Pioneer for nothing.
        . "$GITHUB_WORKSPACE/.github/scripts/skip-if-published.sh" \
            "gcc-${GCC_RELEASE}-riscv64-linux.tar.gz"

        SRC="$GITHUB_WORKSPACE/gcc-${GCC_RELEASE}"
        TARBALL="$GITHUB_WORKSPACE/gcc-${GCC_RELEASE}.tar.xz"
        rm -rf "$SRC" "$TARBALL"

        # ftpmirror.gnu.org redirects to a nearby mirror; the explicit hosts are
        # fallbacks for when it lands on an unhealthy one.
        # The integrity test is not belt-and-braces: a mirror dropping the
        # connection part-way leaves a truncated .tar.xz behind, and a bare
        # "is it non-empty" check would happily hand that to tar, which then
        # fails ~100 MB and one wasted mirror later with "Unexpected EOF in
        # archive". `xz -t` catches it here, so the loop can try the next one.
        for BASE in https://ftpmirror.gnu.org/gcc \
                    https://ftp.gnu.org/gnu/gcc \
                    https://mirrors.kernel.org/gnu/gcc; do
          echo "Fetching from ${BASE}"
          if curl -fL --retry 3 --retry-delay 10 --connect-timeout 30 \
                  -o "$TARBALL" "${BASE}/gcc-${GCC_RELEASE}/gcc-${GCC_RELEASE}.tar.xz" \
             && xz -t "$TARBALL"; then
            echo "Got a complete tarball from ${BASE}"
            break
          fi
          echo "${BASE} did not yield a usable tarball; trying the next mirror"
          rm -f "$TARBALL"
        done
        [ -s "$TARBALL" ] || { echo "No mirror served a complete GCC tarball" >&2; exit 1; }

        tar -xf "$TARBALL" -C "$GITHUB_WORKSPACE"
        rm -f "$TARBALL"
        cd "$SRC"

        # No ./contrib/download_prerequisites here: that is another gcc.gnu.org
        # round-trip that can 429, and the apt-packages above already provide
        # gmp, mpfr and mpc far above the minimums GCC asks for.

        mkdir -p build
        cd build
        #   --disable-bootstrap  builds the compiler once instead of the
        #                        default 3-stage self-rebuild. We ship the
        #                        binary, we don't need the bootstrap identity
        #                        check that distro maintainers do.
        ../configure \
          --prefix="$GITHUB_WORKSPACE/installed_binaries" \
          --disable-werror \
          --disable-multilib \
          --disable-bootstrap

        # This `make` used to sit on the end of the configure line's backslash
        # continuation, so it was passed to configure as an argument rather than
        # run — configure took "make" as the host triplet and rejected "-j<n>".
        make -j"$(nproc)"
        make install

        "$GITHUB_WORKSPACE/installed_binaries/bin/gcc" --version

        GCC_VERSION=$("$GITHUB_WORKSPACE/installed_binaries/bin/gcc" -dumpfullversion -dumpversion)
        ASSET_NAME="gcc-${GCC_VERSION}-riscv64-linux.tar.gz"
        ASSET_PATH="$GITHUB_WORKSPACE/${ASSET_NAME}"
        tar -czf "$ASSET_PATH" -C "$GITHUB_WORKSPACE/installed_binaries" .

        echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
        echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"
      trigger-pages: true
