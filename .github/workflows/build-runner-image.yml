name: Build GitHub Actions Runner Image for RISC-V

# Publishes self-hosted GitHub Actions runner images for linux/riscv64 to
# Docker Hub, built around the riscv64 runner binary from
# https://github.com/Cloud-V-10xE/github-runner-riscv/releases
#
# The image is only rebuilt when that repository cuts a new release. The check
# runs daily on a free x86 runner and compares the upstream version against the
# tags already on Docker Hub; the scarce riscv64 runner is only used when there
# is actually something new to build.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if this runner version is already on Docker Hub (needed after any change to runner-image/, since the check only compares runner versions)'
        required: false
        type: boolean
        default: false
      runner_version:
        description: 'Pin a specific runner version (e.g. 2.336.0). Leave blank for latest.'
        required: false
        type: string
  schedule:
    # Daily. Cheap: this only costs an API call unless a new release exists.
    - cron: "0 05 * * *"

concurrency:
  group: runner-image
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new runner release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      version: ${{ steps.resolve.outputs.version }}
      asset_url: ${{ steps.resolve.outputs.asset_url }}
      asset_sha256: ${{ steps.resolve.outputs.asset_sha256 }}
    steps:
      - name: Resolve latest riscv64 runner release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC_REPO="Cloud-V-10xE/github-runner-riscv"
          PINNED="${{ inputs.runner_version }}"

          if [ -n "$PINNED" ]; then
            # Find the release whose asset matches the pinned version.
            REL=$(gh api "repos/$SRC_REPO/releases" --paginate \
              --jq "[.[] | select(.prerelease==false)
                     | select([.assets[].name] | any(test(\"$PINNED\")))] | first")
          else
            REL=$(gh api "repos/$SRC_REPO/releases" \
              --jq '[.[] | select(.prerelease==false)] | first')
          fi

          [ -n "$REL" ] && [ "$REL" != "null" ] \
            || { echo "::error::No matching release in $SRC_REPO"; exit 1; }

          TAG=$(echo "$REL" | jq -r '.tag_name')

          # Take the version from the ASSET name, not the tag. Tags look like
          # "v2.336.0-riscv64-net8" and that suffix is not guaranteed stable,
          # whereas the asset is always actions-runner-linux-riscv64-X.Y.Z.tar.gz
          ASSET_NAME=$(echo "$REL" | jq -r \
            '[.assets[].name | select(test("actions-runner-linux-riscv64-.*\\.tar\\.gz$"))] | first')
          ASSET_URL=$(echo "$REL" | jq -r \
            '[.assets[] | select(.name | test("actions-runner-linux-riscv64-.*\\.tar\\.gz$"))
              | .browser_download_url] | first')

          [ -n "$ASSET_NAME" ] && [ "$ASSET_NAME" != "null" ] \
            || { echo "::error::Release $TAG has no riscv64 runner tarball"; exit 1; }

          VERSION=$(echo "$ASSET_NAME" \
            | sed -E 's/^actions-runner-linux-riscv64-(.+)\.tar\.gz$/\1/')

          # The API exposes a digest on newer releases; when it is missing the
          # build simply skips verification rather than failing, so an older
          # release stays buildable.
          ASSET_SHA256=$(echo "$REL" | jq -r \
            '[.assets[] | select(.name | test("actions-runner-linux-riscv64-.*\\.tar\\.gz$"))
              | .digest // empty] | first // ""' | sed 's/^sha256://')

          echo "tag=$TAG"
          echo "version=$VERSION"
          echo "asset=$ASSET_NAME"
          echo "sha256=${ASSET_SHA256:-<not published>}"

          {
            echo "version=$VERSION"
            echo "asset_url=$ASSET_URL"
            echo "asset_sha256=$ASSET_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force requested"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Query Docker Hub through docker login so this works whether the
          # repository is public or private. The username is referenced only
          # inside this step — never emitted as a job output, because Actions
          # silently drops outputs whose value matches a secret.
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/github-actions-riscv"
          if docker manifest inspect "${IMAGE}:ubuntu-${VERSION}" >/dev/null 2>&1; then
            echo "runner $VERSION is already published — nothing to do"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "runner $VERSION is not on Docker Hub yet — building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          {
            echo "### Runner image check"
            echo
            echo "- Latest riscv64 runner: **${{ steps.resolve.outputs.version }}**"
            echo "- Build needed: **${{ steps.decide.outputs.should_build }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and push runner images
    needs: check
    if: needs.check.outputs.should_build == 'true'
    # RISE CI enablement project — stays on RISE's Scaleway EM-RV1 fleet
    # rather than the default self-hosted RISCV64 runners.
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      # Sequential: these share one riscv64 runner and each does its own
      # apt-get + installdependencies.sh. Racing them just thrashes the box.
      max-parallel: 1
      fail-fast: false
      # Ubuntu 24.04 only, deliberately.
      #
      # 24.04 is glibc 2.39; Debian trixie is glibc 2.41. Anything compiled
      # inside a trixie-based runner links against GLIBC_2.41 symbols and then
      # dies with "GLIBC_2.41 not found" on 24.04 — which is what the rest of
      # this archive is built on (ubuntu-24.04-riscv). Keeping the runner image
      # on the same base as the build fleet means a binary produced in one of
      # these containers runs anywhere 24.04 runs.
      matrix:
        include:
          - variant: unprivileged
            dockerfile: Dockerfile.ubuntu
            tag: ubuntu
            extra_tag: latest
          - variant: docker-in-docker
            dockerfile: Dockerfile.ubuntu
            tag: docker-ubuntu
            extra_tag: docker-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Record build environment
        uses: ./.github/actions/build-environment
        with:
          package-name: GitHub Actions runner image

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build ${{ matrix.variant }} (Ubuntu 24.04)
        run: |
          set -eux
          VERSION="${{ needs.check.outputs.version }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/github-actions-riscv"

          # Context is runner-image/, not the variant directory: common/runner.sh
          # is shared by both variants so their registration flags cannot drift.
          docker build \
            -f "runner-image/${{ matrix.variant }}/${{ matrix.dockerfile }}" \
            --build-arg "RUNNER_VERSION=${VERSION}" \
            --build-arg "RUNNER_URL=${{ needs.check.outputs.asset_url }}" \
            --build-arg "RUNNER_SHA256=${{ needs.check.outputs.asset_sha256 }}" \
            -t "${IMAGE}:${{ matrix.tag }}-${VERSION}" \
            "runner-image"

      - name: Verify the image actually contains a working runner
        run: |
          set -eux
          VERSION="${{ needs.check.outputs.version }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/github-actions-riscv"
          REF="${IMAGE}:${{ matrix.tag }}-${VERSION}"

          # config.sh --help exits non-zero by design, so check for the binary
          # and the version file rather than trusting an exit code.
          docker run --rm --entrypoint /bin/bash "$REF" -c '
            set -e
            test -f /home/runner/config.sh || { echo "config.sh missing"; exit 1; }
            test -f /home/runner/run.sh    || { echo "run.sh missing"; exit 1; }
            test -x /usr/local/bin/runner.sh || { echo "runner.sh missing"; exit 1; }
            echo "runner version file: $(cat /home/runner/.runner_version 2>/dev/null || echo n/a)"
            file /home/runner/bin/Runner.Listener 2>/dev/null | grep -qi "RISC-V" \
              || echo "note: could not confirm RISC-V ELF via file(1)"
          '

          # runneruser must not be able to rewrite the scripts it is launched
          # from — that is what keeps a compromised job from persisting as root.
          docker run --rm --user 1001 --entrypoint /bin/bash "$REF" -c '
            set -e
            ! test -w /usr/local/bin/runner.sh || { echo "runner.sh is job-writable"; exit 1; }
            echo "entrypoint scripts are not writable by runneruser"
          '

      - name: Smoke-test Docker modes
        if: matrix.variant == 'docker-in-docker'
        run: |
          set -eux
          VERSION="${{ needs.check.outputs.version }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/github-actions-riscv"
          REF="${IMAGE}:${{ matrix.tag }}-${VERSION}"

          # The CLI and both plugins have to be riscv64 binaries that actually
          # execute — an apt package existing is not proof of that.
          docker run --rm --entrypoint /bin/bash "$REF" -c '
            set -e
            docker --version
            docker buildx version
            docker compose version
          '

          # Refuse to publish an image whose dind path cannot start a daemon and
          # build with it. Nested privileged containers are not available on
          # every host, so skip rather than fail when the host will not allow it.
          if ! docker run --rm --privileged --entrypoint /bin/true "$REF"; then
            echo "::warning::host does not permit privileged containers — dind smoke test skipped"
            exit 0
          fi

          docker run --rm --privileged --entrypoint /bin/bash "$REF" -c '
            set -e
            dockerd --host=unix:///var/run/docker.sock --group=docker \
                    --data-root=/var/lib/docker --storage-driver=overlay2 \
                    >/var/log/dockerd.log 2>&1 &
            for i in $(seq 90); do docker version >/dev/null 2>&1 && break; sleep 1; done
            docker info --format "inner daemon: {{.ServerVersion}} storage={{.Driver}}"

            # vfs here means /var/lib/docker was not a real filesystem and every
            # build would copy whole layers instead of using overlay2.
            test "$(docker info --format "{{.Driver}}")" = "overlay2" \
              || { echo "inner daemon fell back to $(docker info --format "{{.Driver}}")"; exit 1; }

            # Tiny context directory on purpose: a context of / would tar the
            # whole root filesystem before the build even starts.
            mkdir -p /tmp/ctx && cp /etc/hostname /tmp/ctx/h
            printf "FROM scratch\nCOPY h /h\n" > /tmp/ctx/Dockerfile
            docker build -t dind-smoke:test /tmp/ctx >/dev/null
            echo "inner docker build succeeded"
          '

      - name: Push ${{ matrix.tag }}-${{ needs.check.outputs.version }}
        run: |
          set -eux
          VERSION="${{ needs.check.outputs.version }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/github-actions-riscv"

          docker push "${IMAGE}:${{ matrix.tag }}-${VERSION}"

          if [ -n "${{ matrix.extra_tag }}" ]; then
            docker tag "${IMAGE}:${{ matrix.tag }}-${VERSION}" \
                       "${IMAGE}:${{ matrix.extra_tag }}"
            docker push "${IMAGE}:${{ matrix.extra_tag }}"
          fi

      - name: Clean up local images
        if: always()
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/github-actions-riscv"
          docker rmi -f "${IMAGE}:${{ matrix.tag }}-${VERSION}" 2>/dev/null || true
          if [ -n "${{ matrix.extra_tag }}" ]; then
            docker rmi -f "${IMAGE}:${{ matrix.extra_tag }}" 2>/dev/null || true
          fi
          docker image prune -f 2>/dev/null || true

  # Runs on the daily schedule too, not just after a build: the description
  # should follow edits to the docs page, which happen far more often than a
  # new runner release. `always()` is what keeps it running on the days the
  # build job is skipped as up to date.
  dockerhub-description:
    name: Sync Docker Hub description
    needs: build
    if: always() && !cancelled()
    uses: ./.github/workflows/_dockerhub-description.yaml
    with:
      repository: github-actions-riscv
      readme-path: docs/packages/github-actions-riscv.md
      short-description: >-
        Self-hosted GitHub Actions runner for linux/riscv64,
        with docker-in-docker support
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
