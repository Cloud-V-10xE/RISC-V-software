# Builds and publishes the calico-node Docker image (the main calico-node
# daemonset container — programs Felix, and node lifecycle/startup).
#
# This is deliberately NOT the same image as build-calico-cni.yaml, even
# though both are built from the exact same `cmd/calico` combined Go binary.
# Verified against the real upstream manifest (manifests/calico.yaml): the
# calico-node daemonset's main container uses `quay.io/calico/node`, built
# from node/Dockerfile — a runit-supervised image carrying Felix, iptables/
# nftables/conntrack tooling, and (upstream) BIRD/confd. The install-cni
# init container uses a DIFFERENT, much smaller image, `quay.io/calico/calico`
# (build-calico-cni.yaml here), built from docker/calico/Dockerfile — no
# runit, no dataplane tooling, just the binary. Do not collapse these back
# into one image; the runtime requirements are genuinely different.
#
# Scope decision — VXLAN only, no BIRD/BGP:
#   This image deliberately ships without BIRD, bird6, birdcl, birdcl6, or
#   the confd runit service. Traced from real source (node/pkg/lifecycle/
#   startup, node/pkg/health/health.go, node/filesystem/etc/rc.local): BIRD
#   is only ever invoked if CALICO_NETWORKING_BACKEND resolves to something
#   other than "none"/"vxlan" — rc.local's case statement is the sole gate,
#   and it simply never copies the bird/bird6/confd runit service
#   directories into /etc/service/enabled when the backend is vxlan or none,
#   so the supervisor never discovers or execs those binaries. No code path
#   here (shell entrypoint, runit, or the Go startup/health checks) requires
#   BIRD's presence in that mode. This image sets CALICO_NETWORKING_BACKEND
#   =vxlan as its own Dockerfile default specifically so that an operator
#   forgetting to set `calico_backend: vxlan` in the calico-config ConfigMap
#   fails safe (no BGP daemon this image doesn't ship gets invoked) rather
#   than crash-looping a missing-binary bird runit service.
#   BIRD's own riscv64 buildability WAS separately verified (Calico's fork,
#   commit 9111ec3c3ff3e769727a5940d3d829a0be8b5201, cross-compiles cleanly
#   to real riscv64 ELF binaries with zero source-level blockers) in case
#   BGP support is ever wanted later — see docs/packages/calico.md. It is
#   not included here because full-mesh BGP peering does not fit a
#   spoke-only WireGuard topology without a route reflector, and VXLAN needs
#   only the IP reachability such a topology already provides.
#
# Why a fresh, self-contained Calico source checkout here too (not shared
# with build-calico.yaml/build-calico-felix.yaml): matches this repo's
# existing convention of fully independent build workflows — no shared
# build artifacts, no coupling between failure domains. The version is read
# back from build-calico.yaml's own published asset (never independently
# resolved), the same guarantee build-calico-felix.yaml already relies on,
# so this image's Calico version can never drift from calicoctl/typha/Felix.
name: Build Calico Node Image for RISC-V and x86

on:
  workflow_dispatch:
  schedule:
    - cron: "0 02 26 * *"

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      calico_version: ${{ steps.version.outputs.calico_version }}
    steps:
      - name: Resolve the Calico version to build
        id: version
        run: |
          set -eux
          CALICO_VERSION=$(curl -fsSL --retry 5 --retry-delay 10 \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r '[.[].assets[].name
                      | select(test("^calico-[0-9][^-]*-riscv64-linux\\.tar\\.gz$"))
                      | capture("^calico-(?<v>[0-9][^-]*)-riscv64-linux\\.tar\\.gz$").v]
                     | sort_by(split(".") | map(tonumber? // 0)) | last // empty')
          [ -n "$CALICO_VERSION" ] || {
            echo "::error::No published calico-*-riscv64-linux.tar.gz asset found." >&2
            echo "Run build-calico.yaml first — this image is built to match" >&2
            echo "whatever Calico version is already published, not some" >&2
            echo "independently resolved 'latest'." >&2
            exit 1
          }
          echo "Building calico-node image to match published Calico ${CALICO_VERSION}"
          echo "calico_version=$CALICO_VERSION" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: get-version
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      CALICO_VERSION: ${{ needs.get-version.outputs.calico_version }}
    steps:
      - name: Checkout repo (for the local build-environment action)
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Record build environment
        uses: ./.github/actions/build-environment
        with:
          package-name: Calico Node image (x86_64)

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libelf-dev zlib1g-dev libpcap-dev \
            git xz-utils jq

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fetch Calico source
        run: |
          set -eux
          SRC="$GITHUB_WORKSPACE/calico"
          TARBALL="$GITHUB_WORKSPACE/calico-v${CALICO_VERSION}.tar.gz"
          rm -rf "$SRC" "$TARBALL"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 \
               -o "$TARBALL" \
               "https://github.com/projectcalico/calico/archive/refs/tags/v${CALICO_VERSION}.tar.gz"
          tar -tf "$TARBALL" > /dev/null
          mkdir -p "$SRC"
          tar -xf "$TARBALL" -C "$SRC" --strip-components=1
          rm -f "$TARBALL"

      - name: Build libbpf (amd64)
        run: |
          set -eux
          SRC="$GITHUB_WORKSPACE/calico"
          cd "$SRC"
          LIBBPF_VERSION=$(awk -F= '/^LIBBPF_VERSION=/{print $2; exit}' metadata.mk)
          [ -n "$LIBBPF_VERSION" ] || { echo "::error::Could not read LIBBPF_VERSION from metadata.mk" >&2; exit 1; }
          cd felix/bpf-gpl
          rm -rf libbpf
          git clone --depth 1 --branch "$LIBBPF_VERSION" https://github.com/libbpf/libbpf.git
          mkdir -p libbpf/src/amd64
          make -j"$(nproc)" -C libbpf/src BUILD_STATIC_ONLY=1 OBJDIR=amd64 \
            EXTRA_CFLAGS="-fPIC -Wno-error"

      - name: Build the combined calico binary
        run: |
          set -eux
          SRC="$GITHUB_WORKSPACE/calico"
          cd "$SRC"
          LIBBPF_A="$SRC/felix/bpf-gpl/libbpf/src/amd64/libbpf.a"
          [ -f "$LIBBPF_A" ] || { echo "::error::libbpf.a was not produced" >&2; exit 1; }

          PREFIX="$GITHUB_WORKSPACE/installed_binaries"
          mkdir -p "$PREFIX"

          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L${SRC}/felix/bpf-gpl/libbpf/src/amd64 -lbpf -lelf -lz -lpcap"
          export CGO_CFLAGS="-I${SRC}/felix/bpf-gpl/libbpf/src -I${SRC}/felix/bpf-gpl"

          go build -o "$PREFIX/calico" ./cmd/calico

          file "$PREFIX/calico"
          file "$PREFIX/calico" | grep -q "x86-64" \
            || { echo "::error::calico binary is not x86_64" >&2; exit 1; }
          file "$PREFIX/calico" | grep -q "dynamically linked" \
            || { echo "::error::calico binary is not dynamically linked — CGO likely did not take effect" >&2; exit 1; }

      - name: Stage image build context
        run: |
          set -eux
          SRC="$GITHUB_WORKSPACE/calico"
          STAGE="$GITHUB_WORKSPACE/node-image-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/filesystem/etc/calico" \
                   "$STAGE/filesystem/etc/service/available/felix/log" \
                   "$STAGE/filesystem/etc/service/available/node-services/log" \
                   "$STAGE/filesystem/sbin"

          # Config/supervision files come straight from Calico's own source
          # tree — pure shell/config, arch-independent, unmodified. Only the
          # bird/bird6/confd service directories are deliberately omitted
          # (see the file header): this image never ships those binaries.
          cp "$SRC/node/filesystem/etc/rc.local" "$STAGE/filesystem/etc/rc.local"
          cp "$SRC/node/filesystem/etc/calico/felix.cfg" "$STAGE/filesystem/etc/calico/felix.cfg"
          cp "$SRC/node/filesystem/etc/service/available/felix/run" \
             "$STAGE/filesystem/etc/service/available/felix/run"
          cp "$SRC/node/filesystem/etc/service/available/felix/log/run" \
             "$STAGE/filesystem/etc/service/available/felix/log/run"
          cp "$SRC/node/filesystem/etc/service/available/node-services/run" \
             "$STAGE/filesystem/etc/service/available/node-services/run"
          cp "$SRC/node/filesystem/etc/service/available/node-services/log/run" \
             "$STAGE/filesystem/etc/service/available/node-services/log/run"
          cp "$SRC/node/filesystem/sbin/start_runit" "$STAGE/filesystem/sbin/start_runit"

          cp "$GITHUB_WORKSPACE/installed_binaries/calico" "$STAGE/calico"

          cat > "$STAGE/Dockerfile" << 'EOF'
          ARG BASE_IMAGE=debian:trixie-slim
          FROM ${BASE_IMAGE}

          # runit: process supervisor (matches upstream's runit-based node
          # image, but from Debian's own package — no from-source build
          # needed, unlike upstream's AlmaLinux/UBI build, which only builds
          # runit from source because no UBI/AlmaLinux package provides it).
          # iptables/nftables/conntrack/ipset/iproute2/net-tools/kmod/
          # iputils-ping/procps/findutils/debianutils: the same dataplane
          # tooling upstream's node image carries, resolved via Debian's own
          # dependency graph rather than upstream's manual UBI/AlmaLinux RPM
          # chaining.
          RUN apt-get update && apt-get install -y --no-install-recommends \
                runit iptables nftables conntrack ipset iproute2 net-tools \
                kmod iputils-ping procps findutils debianutils ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          COPY filesystem/ /
          COPY calico /usr/bin/calico

          RUN chmod +x /usr/bin/calico /sbin/start_runit /etc/rc.local \
                /etc/service/available/felix/run \
                /etc/service/available/felix/log/run \
                /etc/service/available/node-services/run \
                /etc/service/available/node-services/log/run

          ENV SVDIR=/etc/service/enabled
          # Fail-safe default: this image ships no BIRD/bird6 binaries. If an
          # operator ever forgets to set calico_backend in the calico-config
          # ConfigMap, rc.local's default branch would otherwise try to run
          # BIRD/confd, and the missing bird binary would crash-loop under
          # runit. Defaulting to vxlan here means that failure mode simply
          # cannot happen from this image's own default.
          ENV CALICO_NETWORKING_BACKEND=vxlan

          LABEL org.opencontainers.image.description="calico-node (RISC-V/x86, VXLAN-only build, no BIRD/BGP) — built by Cloud-V-10xE/RISC-V-software"
          LABEL org.opencontainers.image.source="https://github.com/projectcalico/calico"

          CMD ["/sbin/start_runit"]
          EOF

      - name: Build and push calico-node (amd64)
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/node-image-stage"
          docker build \
            --build-arg BASE_IMAGE=debian:trixie-slim \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:${CALICO_VERSION}-amd64" \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:latest-amd64" \
            .
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:${CALICO_VERSION}-amd64"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:latest-amd64"

  build-riscv64:
    needs: get-version
    # Self-hosted Milk-V Pioneer fleet, not RISE's ubuntu-24.04-riscv runners:
    # this build needs the local Docker daemon (docker build/push), and it is
    # a large monorepo compile — the same reasoning build-calico.yaml and
    # build-calico-felix.yaml already use for staying off the RISE fleet.
    runs-on: RISCV64
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CALICO_VERSION: ${{ needs.get-version.outputs.calico_version }}
    steps:
      - name: Verify Docker is available on this runner
        run: |
          # This job needs a Docker-capable self-hosted runner (see
          # runner-image/docker-in-docker/). If the RISCV64 label ever routes
          # here to the no-Docker/"unprivileged" runner variant, fail with a
          # clear message instead of a confusing failure deep in the build.
          docker version || {
            echo "::error::Docker is not available on this runner. This job needs the docker-capable RISCV64 runner variant (see runner-image/docker-in-docker/)." >&2
            exit 1
          }

      - name: Checkout repo (for the local build-environment action)
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Record build environment
        uses: ./.github/actions/build-environment
        with:
          package-name: Calico Node image (riscv64)

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libelf-dev zlib1g-dev libpcap-dev \
            git xz-utils jq

      - name: Setup Go
        run: |
          set -eu
          GO_VER=$(curl -fsSL --retry 3 'https://go.dev/dl/?mode=json' 2>/dev/null \
            | grep -o '"version"[[:space:]]*:[[:space:]]*"go[0-9.]*"' | head -n1 \
            | grep -o 'go[0-9.]*' || true)
          [ -n "$GO_VER" ] || GO_VER="go1.24.6"
          curl -fsSL --retry 3 --retry-delay 10 -o /tmp/go.tar.gz \
            "https://go.dev/dl/${GO_VER}.linux-riscv64.tar.gz"
          sudo apt-get remove -y golang golang-go 2>/dev/null || true
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          /usr/local/go/bin/go version

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Fetch Calico source
        run: |
          set -eux
          SRC="$GITHUB_WORKSPACE/calico"
          TARBALL="$GITHUB_WORKSPACE/calico-v${CALICO_VERSION}.tar.gz"
          rm -rf "$SRC" "$TARBALL"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 \
               -o "$TARBALL" \
               "https://github.com/projectcalico/calico/archive/refs/tags/v${CALICO_VERSION}.tar.gz"
          tar -tf "$TARBALL" > /dev/null
          mkdir -p "$SRC"
          tar -xf "$TARBALL" -C "$SRC" --strip-components=1
          rm -f "$TARBALL"

      - name: Build libbpf (riscv64)
        run: |
          set -eux
          SRC="$GITHUB_WORKSPACE/calico"
          cd "$SRC"
          LIBBPF_VERSION=$(awk -F= '/^LIBBPF_VERSION=/{print $2; exit}' metadata.mk)
          [ -n "$LIBBPF_VERSION" ] || { echo "::error::Could not read LIBBPF_VERSION from metadata.mk" >&2; exit 1; }
          cd felix/bpf-gpl
          rm -rf libbpf
          git clone --depth 1 --branch "$LIBBPF_VERSION" https://github.com/libbpf/libbpf.git
          mkdir -p libbpf/src/riscv64
          make -j"$(nproc)" -C libbpf/src BUILD_STATIC_ONLY=1 OBJDIR=riscv64 \
            EXTRA_CFLAGS="-fPIC -Wno-error"

      - name: Build the combined calico binary
        run: |
          set -eux
          SRC="$GITHUB_WORKSPACE/calico"
          cd "$SRC"
          LIBBPF_A="$SRC/felix/bpf-gpl/libbpf/src/riscv64/libbpf.a"
          [ -f "$LIBBPF_A" ] || { echo "::error::libbpf.a was not produced" >&2; exit 1; }

          PREFIX="$GITHUB_WORKSPACE/installed_binaries"
          mkdir -p "$PREFIX"

          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L${SRC}/felix/bpf-gpl/libbpf/src/riscv64 -lbpf -lelf -lz -lpcap"
          export CGO_CFLAGS="-I${SRC}/felix/bpf-gpl/libbpf/src -I${SRC}/felix/bpf-gpl"

          go build -o "$PREFIX/calico" ./cmd/calico

          file "$PREFIX/calico"
          file "$PREFIX/calico" | grep -q "RISC-V" \
            || { echo "::error::calico binary is not a RISC-V binary" >&2; exit 1; }
          file "$PREFIX/calico" | grep -q "dynamically linked" \
            || { echo "::error::calico binary is not dynamically linked — CGO likely did not take effect" >&2; exit 1; }

      - name: Stage image build context
        run: |
          set -eux
          SRC="$GITHUB_WORKSPACE/calico"
          STAGE="$GITHUB_WORKSPACE/node-image-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/filesystem/etc/calico" \
                   "$STAGE/filesystem/etc/service/available/felix/log" \
                   "$STAGE/filesystem/etc/service/available/node-services/log" \
                   "$STAGE/filesystem/sbin"

          cp "$SRC/node/filesystem/etc/rc.local" "$STAGE/filesystem/etc/rc.local"
          cp "$SRC/node/filesystem/etc/calico/felix.cfg" "$STAGE/filesystem/etc/calico/felix.cfg"
          cp "$SRC/node/filesystem/etc/service/available/felix/run" \
             "$STAGE/filesystem/etc/service/available/felix/run"
          cp "$SRC/node/filesystem/etc/service/available/felix/log/run" \
             "$STAGE/filesystem/etc/service/available/felix/log/run"
          cp "$SRC/node/filesystem/etc/service/available/node-services/run" \
             "$STAGE/filesystem/etc/service/available/node-services/run"
          cp "$SRC/node/filesystem/etc/service/available/node-services/log/run" \
             "$STAGE/filesystem/etc/service/available/node-services/log/run"
          cp "$SRC/node/filesystem/sbin/start_runit" "$STAGE/filesystem/sbin/start_runit"

          cp "$GITHUB_WORKSPACE/installed_binaries/calico" "$STAGE/calico"

          cat > "$STAGE/Dockerfile" << 'EOF'
          ARG BASE_IMAGE=riscv64/debian:trixie-slim
          FROM ${BASE_IMAGE}

          RUN apt-get update && apt-get install -y --no-install-recommends \
                runit iptables nftables conntrack ipset iproute2 net-tools \
                kmod iputils-ping procps findutils debianutils ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          COPY filesystem/ /
          COPY calico /usr/bin/calico

          RUN chmod +x /usr/bin/calico /sbin/start_runit /etc/rc.local \
                /etc/service/available/felix/run \
                /etc/service/available/felix/log/run \
                /etc/service/available/node-services/run \
                /etc/service/available/node-services/log/run

          ENV SVDIR=/etc/service/enabled
          ENV CALICO_NETWORKING_BACKEND=vxlan

          LABEL org.opencontainers.image.description="calico-node (RISC-V/x86, VXLAN-only build, no BIRD/BGP) — built by Cloud-V-10xE/RISC-V-software"
          LABEL org.opencontainers.image.source="https://github.com/projectcalico/calico"

          CMD ["/sbin/start_runit"]
          EOF

      - name: Build and push calico-node (riscv64)
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/node-image-stage"
          docker build \
            --build-arg BASE_IMAGE=riscv64/debian:trixie-slim \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:${CALICO_VERSION}-riscv64" \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:latest-riscv64" \
            .
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:${CALICO_VERSION}-riscv64"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:latest-riscv64"

  create-manifests:
    needs: [get-version, build-amd64, build-riscv64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CALICO_VERSION: ${{ needs.get-version.outputs.calico_version }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          set -eux
          for TAG in "${CALICO_VERSION}" "latest"; do
            docker manifest rm "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:${TAG}" 2>/dev/null || true
            docker manifest create \
              "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:${TAG}" \
              "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:${TAG}-amd64" \
              "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:${TAG}-riscv64"
            docker manifest push "${{ secrets.DOCKERHUB_USERNAME }}/calico-node:${TAG}"
          done
