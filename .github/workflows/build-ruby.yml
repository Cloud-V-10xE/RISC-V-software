# Overlay for Ruby. Common scaffolding lives in _build-package.yaml.
name: Build Ruby for RISC-V

on:
  workflow_dispatch:
  schedule:
    - cron: "0 02 8 * *"

jobs:
  build:
    permissions:
      contents: write
      actions: write
      id-token: write      # attest-build-provenance
      attestations: write  # attest-build-provenance
    uses: ./.github/workflows/_build-package.yaml
    with:
      package-name: Ruby RISC-V
      timeout-minutes: 180
      apt-packages: >-
        build-essential git wget jq libssl-dev libreadline-dev zlib1g-dev
        libyaml-dev libgdbm-dev libncurses5-dev libffi-dev autoconf bison ruby
      build-script: |
        set -eux
        # Build from the official release tarball, not a git checkout.
        #
        # A git build has to fetch the bundled gems through tool/downloader.rb.
        # The previous script stubbed that file out to avoid the network, but
        # the stub never defined the `Downloader` constant defs/gmake.mk calls
        # into, so every build died with "uninitialized constant Downloader".
        # Release tarballs already contain the gems *and* a pre-generated
        # configure, so the whole problem disappears.
        INDEX=$(curl -fsSL --retry 3 --retry-delay 5 \
          https://cache.ruby-lang.org/pub/ruby/index.txt)
        VERSION=$(echo "$INDEX" \
          | grep -oE 'ruby-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
          | sed -E 's/^ruby-(.*)\.tar\.gz$/\1/' \
          | sort -V | tail -n1)
        [ -n "$VERSION" ] || { echo "Could not determine latest Ruby version" >&2; exit 1; }
        echo "Latest Ruby: $VERSION"

        MAJMIN=$(echo "$VERSION" | cut -d. -f1,2)
        curl -fL --retry 3 --retry-delay 10 \
          -o "$GITHUB_WORKSPACE/ruby.tar.gz" \
          "https://cache.ruby-lang.org/pub/ruby/${MAJMIN}/ruby-${VERSION}.tar.gz"

        rm -rf "$GITHUB_WORKSPACE/ruby-src"
        mkdir -p "$GITHUB_WORKSPACE/ruby-src"
        tar -xzf "$GITHUB_WORKSPACE/ruby.tar.gz" \
          -C "$GITHUB_WORKSPACE/ruby-src" --strip-components=1

        cd "$GITHUB_WORKSPACE/ruby-src"
        ./configure \
          --prefix="$GITHUB_WORKSPACE/ruby-install" \
          --enable-shared \
          --disable-install-doc \
          --with-baseruby="$(which ruby)"

        make -j"$(nproc)"
        make install

        "$GITHUB_WORKSPACE/ruby-install/bin/ruby" --version
        "$GITHUB_WORKSPACE/ruby-install/bin/gem" --version

        ASSET_NAME="ruby-${VERSION}-riscv64-linux.tar.gz"
        ASSET_PATH="$GITHUB_WORKSPACE/${ASSET_NAME}"
        tar -czf "$ASSET_PATH" -C "$GITHUB_WORKSPACE/ruby-install" .

        echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
        echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"
